# Broker local do AgriShield, para desenvolvimento sem internet.
#
# `allow_anonymous true` só é aceitável porque este broker **não sai da sua máquina**:
# ele escuta no container e é publicado apenas em localhost pelo docker-compose.yml.
# O contrato (document/contrato-mqtt.md) exige broker privado, TLS e credenciais em
# produção — nada disso está aqui, e este arquivo não é ponto de partida para produção.

listener 1883
allow_anonymous true

# Mensagens retained (o `config` do equipamento) sobrevivem a reinício do broker, como
# no contrato: o ESP32 recebe o último limite assim que conecta.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type warning
log_type error
