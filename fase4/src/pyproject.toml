[project]
name = "soil-data-api"
version = "0.1.0"
description = "API FastAPI para inserção de dados do solo em Oracle"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "oracledb>=2.5.0",
    "pandas>=3.0.3",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "streamlit>=1.58.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
create-table = "create_table:create_table"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
]
